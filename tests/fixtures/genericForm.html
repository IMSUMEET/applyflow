<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Senior Engineer at Acme Corp | Careers</title></head>
<body>
<form id="application-form">
  <!-- Personal -->
  <div>
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" />
  </div>
  <div>
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" />
  </div>
  <div>
    <label for="email_address">Email Address</label>
    <input type="email" id="email_address" name="email" />
  </div>
  <div>
    <label for="phone_number">Phone Number</label>
    <input type="tel" id="phone_number" name="phone" />
  </div>

  <!-- Location -->
  <div>
    <label for="city">City</label>
    <input type="text" id="city" name="city" />
  </div>
  <div>
    <label for="state">State</label>
    <input type="text" id="state" name="state" />
  </div>

  <!-- Professional -->
  <div>
    <label for="linkedin_url">LinkedIn URL</label>
    <input type="url" id="linkedin_url" name="linkedinUrl" />
  </div>
  <div>
    <label for="github_url">GitHub URL</label>
    <input type="url" id="github_url" name="githubUrl" />
  </div>

  <!-- Summary -->
  <div>
    <label for="summary">Professional Summary</label>
    <textarea id="summary" name="summary" rows="4"></textarea>
  </div>

  <!-- Work authorization (select) -->
  <div>
    <label for="work_auth">Work Authorization</label>
    <select id="work_auth" name="workAuthorization">
      <option value="">Select...</option>
      <option value="us_citizen">US Citizen</option>
      <option value="green_card">Green Card</option>
      <option value="h1b">H-1B</option>
      <option value="opt">OPT/CPT</option>
    </select>
  </div>

  <!-- Sponsorship (radio) -->
  <fieldset>
    <legend>Do you require visa sponsorship?</legend>
    <label><input type="radio" name="requiresSponsorship" value="yes" /> Yes</label>
    <label><input type="radio" name="requiresSponsorship" value="no" /> No</label>
  </fieldset>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
