<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senior Backend Engineer at Notion | Lever</title>
</head>
<body>
<!-- Lever uses a single "name" field + explicit name attributes -->
<form id="application-form">
  <div class="application-field">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" />
  </div>
  <div class="application-field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" />
  </div>
  <div class="application-field">
    <label for="phone">Phone number</label>
    <input id="phone" name="phone" type="tel" />
  </div>
  <div class="application-field">
    <label for="org">Current company</label>
    <input id="org" name="org" type="text" />
  </div>
  <div class="application-field">
    <label for="linkedin">LinkedIn profile</label>
    <input id="linkedin" name="urls[LinkedIn]" type="url" placeholder="https://linkedin.com/in/..." />
  </div>
  <div class="application-field">
    <label for="github">GitHub</label>
    <input id="github" name="urls[GitHub]" type="url" placeholder="https://github.com/..." />
  </div>
  <div class="application-field">
    <label for="portfolio">Portfolio</label>
    <input id="portfolio" name="urls[Portfolio]" type="url" />
  </div>
  <div class="application-field">
    <label for="comments">Additional information</label>
    <textarea id="comments" name="comments" placeholder="Add a cover letter or anything else you want to share..."></textarea>
  </div>
</form>
</body>
</html>
